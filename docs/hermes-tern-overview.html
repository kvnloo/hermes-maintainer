<!doctype html>
<html lang="en">
<head>

  <meta property="og:title" content="Hermes × Tern · project overview">

  <style>
    :root { color-scheme:light; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fbfcfe; color:#172033; }
    .shell { max-width:1120px; margin:auto; padding:22px 18px 60px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; font-size:13px; }
    header a, footer a { color:#43627b; text-decoration:none; }
    .crumb { font-weight:550; letter-spacing:.02em; }
    .date { color:#7a8493; }
    .frame { background:white; border:1px solid #e7e9ee; border-radius:22px; overflow:hidden; box-shadow:0 15px 45px rgba(25,37,60,.055); margin:26px 0 20px; }
    .frame object { display:block; width:100%; aspect-ratio:1448 / 1086; }
    nav { display:flex; gap:10px; flex-wrap:wrap; }
    nav a { display:inline-flex; align-items:center; gap:6px; padding:10px 15px; border-radius:12px; border:1px solid #e1e7ef; text-decoration:none; color:#2567ce; background:white; font-weight:550; font-size:14px; }
    nav a:hover { border-color:#b8d1ff; background:#f1f6ff; }
    footer { margin-top:25px; color:#89919e; font-size:13px; line-height:1.55; }
    @media(max-width:640px) { .shell { padding:12px 8px 40px; } .frame { border-radius:12px; margin:12px 0 14px; } header, nav, footer { padding:0 7px; } }
  </style>
</head>
<body>
<main class="shell">
  <header>
    <a class="crumb" href="../">hermes-maintainer / artifacts</a>

  <div class="frame">
    <object type="image/svg+xml" data="./assets/hermes-tern-overview.svg" aria-label="Hermes and Tern project issues, branches and pull requests">

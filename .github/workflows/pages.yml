name: pages

# Actions-based GitHub Pages (not the legacy branch source).
# Live URL: https://kvnloo.github.io/hermes-maintainer/
# configure-pages enablement: true turns Pages on when this workflow can write.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'kvnloo/hermes-maintainer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static snapshot
        run: python3 scripts/build-pages.py --out site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.repository == 'kvnloo/hermes-maintainer'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

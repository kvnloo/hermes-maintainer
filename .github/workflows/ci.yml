name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Pytest
        run: python -m pytest -q
      - name: Pages snapshot
        run: python3 scripts/build-pages.py --out /tmp/hermes-pages-site

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/hermes_maintainer/ui/graph-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/hermes_maintainer/ui/graph-src/package-lock.json
      - name: Install
        run: npm ci
      - name: Test or verify bundle
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No npm test script on this revision; verifying esbuild bundle"
            npx esbuild graph-app.jsx --bundle --format=iife --outfile=/tmp/graph-app.js --minify --jsx=transform
          fi

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-maintainer"
version = "0.1.0"
description = "Local-first backlog graph, triage, campaign coordination, and merge-set analytics for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "rich>=13.8,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
solver = ["ortools>=9.11,<10"]
embeddings = ["sentence-transformers>=3,<4", "numpy>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
hermes-maintainer = "hermes_maintainer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_maintainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".verified-oss-loop",
  ".github/scripts",
  "scripts/rollout.py",
  "scripts/cluster-similar-issues.py",
]
